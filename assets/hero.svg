<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
<title id="title">Hero</title>
<desc id="desc">Shreyas Pabbathi. Ideas into things you can use. AI tools, creative systems, and open source. A wireframe cube rotates inside orbital rings.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif}.mono{font-family:Consolas,Menlo,monospace}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<rect width="960" height="360" rx="18" fill="#101a20"/>
<defs>
  <radialGradient id="halo"><stop stop-color="#8fe3c3" stop-opacity=".16"/><stop offset="1" stop-color="#8fe3c3" stop-opacity="0"/></radialGradient>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#31464f"/></pattern>
</defs>
<rect x="590" y="1" width="369" height="358" fill="url(#dots)"/>
<circle cx="759" cy="175" r="180" fill="url(#halo)"/>
<text x="44" y="49" font-size="16" fill="#acbec5" class="mono">shrenzoo / build log</text>
<text x="42" y="128" font-size="65" fill="#f2f6f4" font-weight="700" letter-spacing="-3">Shreyas</text>
<text x="42" y="201" font-size="65" fill="#f2f6f4" font-weight="700" letter-spacing="-3">Pabbathi.</text>
<text x="46" y="253" font-size="25" fill="#8fe3c3" >Ideas into things you can use.</text>
<text x="46" y="315" font-size="16" fill="#acbec5" class="mono">AI tools  /  creative systems  /  open source</text>
<g transform="translate(757 172)" fill="none" stroke="#8fe3c3">
  <circle r="104" stroke-opacity=".24"/>
  <circle r="72" stroke-opacity=".2"/>
  <ellipse rx="120" ry="43" transform="rotate(-36)" stroke-opacity=".6"/>
  <ellipse rx="120" ry="43" transform="rotate(36)" stroke-opacity=".35"/>
  <g stroke-width="1.5">
    <path d="M0 -67 59 -34 59 34 0 68 -59 34 -59 -34Z M0 0 0 68 M0 0 59 -34 M0 0 -59 -34 M0 -67 0 0"/>
    <path d="M-59 34 0 0 59 34" stroke-dasharray="3 5" stroke-opacity=".35"/>
    <animateTransform attributeName="transform" type="rotate" values="0;360" dur="32s" repeatCount="indefinite"/>
  </g>
  <g><circle cx="104" r="6" fill="#ffbb7d" stroke="#101a20" stroke-width="4"/>
    <animateTransform attributeName="transform" type="rotate" values="0;360" dur="16s" repeatCount="indefinite"/>
  </g>
  <g><circle cx="-72" r="4" fill="#8fe3c3" stroke="none"/>
    <animateTransform attributeName="transform" type="rotate" values="0;-360" dur="22s" repeatCount="indefinite"/>
  </g>
</g>
<path d="M650 307H893" stroke="#31464f"/>
<text x="651" y="332" font-size="15" fill="#acbec5" class="mono">think / build / refine</text>

</svg>