name: Update contribution snake

on:
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/contributions.yml'
      - 'scripts/snake_posters.py'

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out profile
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Generate contribution animations
        uses: Platane/snk@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: Shrenzoo
          outputs: |
            assets/contributions.svg?color_snake=%23d77939&color_dots=%23edf2f0,%23c4e8da,%2386cdb3,%234b9b7c,%23236b52
            assets/contributions-dark.svg?palette=github-dark&color_snake=%23ffbb7d&color_dots=%231a2830,%232b5148,%233e8069,%2366b596,%238fe3c3
      - name: Create reduced-motion alternatives
        run: python3 scripts/snake_posters.py
      - name: Publish changed artwork
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/contributions*.svg
          if ! git diff --cached --quiet; then
            git commit -m 'Update contribution snake'
            git push
          fi
